# Banned patterns (practice C6). Three things go wrong when code matches words or text:
# deciding what a person meant, reading a generated structured language with a regex, and
# fixing in code knowledge that is, or will become, configurable or evolving.
#
# A regex or a fixed list is fine for a field's format (an email address, a postcode, a
# phone number) and for a closed machine format (file extensions, a protocol's fixed tokens,
# ISO codes, a provider's documented enum, a log format the code itself writes). When one of
# those trips a rule, narrow the rule first; a nosemgrep line is the last resort.
#
# Severity: ERROR fails the gate on a line a pull request adds. WARNING is listed for the
# reviewer and fails nothing. Every finding may be kept with a reviewed reason:
#   # nosemgrep: <rule-id> -- <reason>

# Shapes that several rules share. semgrep reads only `rules`; a rule names a shape by its YAML
# alias (*name), so each shape is defined once.
x-shapes:
  # A set, list, tuple or frozenset literal of three or more words and no key, code or path, or a
  # string of three or more words split into a list. A word is lowercase letters with an inner
  # space, apostrophe or hyphen. The literal's other strings may be prose ("see you ", "?", "", other
  # scripts) but hold no _, /, digit or capital: one that does makes the list a program's own keys,
  # codes or paths. A dict is left out: most map a program's own keys to labels.
  words: &words (?s)^(?=((frozenset|set|tuple|list)\((\s|#[^\n]*)*)?[\[({](\s|#[^\n]*)*(("[^"\\_/0-9A-Z\n]*"|'[^'\\_/0-9A-Z\n]*')(\s|#[^\n]*)*,(\s|#[^\n]*)*)*("[^"\\_/0-9A-Z\n]*"|'[^'\\_/0-9A-Z\n]*')(\s|#[^\n]*)*,?(\s|#[^\n]*)*[\])}](\s|#[^\n]*)*\)?$)(.*?[\[({,](\s|#[^\n]*)*("[a-z]+([ '-][a-z]+)*"|'[a-z]+([ -][a-z]+)*')(?=(\s|#[^\n]*)*[,\])}])){3}|^((frozenset|set|tuple|list)\()?("""|"|')\s*[a-z]+(['-][a-z]+)*(\s+[a-z]+(['-][a-z]+)*){2,}\s*("""|"|')\.split\(("[ ]"|'[ ]')?\)\)?$
  # A regex that alternates three or more words, with \b, \s and ? allowed in a word. An
  # alternation after \. lists file extensions.
  word-alternation: &word-alternation (?s).*((?<!\\\.)\((\?:|\?P<\w+>)?|\(\?[aiLmsux]+\)|["']\^?)((\\b)?[a-z]+\??(([ '-]|\\s[+*?]?)[a-z]+\??)*(\\b)?\|){2,}(\\b)?[a-z]+\??(([ '-]|\\s[+*?]?)[a-z]+\??)*(\\b)?(?=[|)"'])
  # A regex that reads SQL: a SQL keyword, or a word SQL shares with prose beside an identifier class.
  sql: &sql (?is).*((select|where|join|having|coalesce|union|returning|ilike|distinct|intersect|insert|truncate|(group|order)\\s[*+]?by)(\\b|\\s)|(\\b|\\s[*+?]?|[^a-z\\])(as|on|from|into|values|limit|offset|over)(\\s|\\b).*\[a-z_\]|\[a-z_\].*(\\b|\\s[*+?]?|[^a-z\\])(as|on|from|into|values|limit|offset|over)(\\s|\\b))
  # A regex that reads markup: a tag (<a, </, <!--, <\w), a tag body ([^>]), an attribute (href=),
  # an entity (&#).
  markup: &markup (?s).*((?<!\?P)(?<!\?)<[A-Za-z!/]|<\\?/|<\\w|<\\s[*]?/|<\[|\[\^>|(href|src)(\\s[*+?]?)?=|&#(\\d|x|\[|0)|&\(\?:)

rules:
  - id: ep-lexical-intent
    languages: [python]
    severity: ERROR
    message: >-
      ep-lexical-intent: a word list or a word regex decides what a person meant. Word
      lists miss phrasings, negations and other languages, and they grow one case at a
      time. Sound shapes: a model reads the text against the pending state and returns
      structured output, and code enforces only the safety rules; or the interface asks
      the person to choose. A check of a field's format, or of a closed machine format,
      is fine: keep it with `# nosemgrep: ep-lexical-intent -- <reason>`, which the
      reviewer checks. If you cannot decide, ask the operator.
    metadata:
      example: |
        CONFIRM_WORDS = {"yes", "ok", "sure"}
        if all(word in CONFIRM_WORDS for word in message_text.lower().split()): ...
    mode: taint
    pattern-sources:
      # A value named for text a person wrote.
      - patterns:
          - pattern-either:
              - pattern: $NAME
              - pattern: $OBJ.$NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(text|question|reply|utterance|user_text|user_message|message_text|user_input)$
      # Text split into words: only prose is split into words to be looked up.
      - pattern: $X.split()
      - pattern: $X.split(" ")
      - patterns:
          - pattern-either:
              - pattern: re.findall($P, ...)
              - pattern: re.finditer($P, ...)
          - metavariable-regex:
              metavariable: $P
              regex: ^[rR]?["'](\\w|\[[^\]]*\][*+])
      - patterns:
          - pattern: re.split($P, ...)
          - metavariable-regex:
              metavariable: $P
              regex: ^[rR]?["'](\\W|\\s)
      # A list built from those words. Semgrep loses the taint inside a comprehension that
      # reshapes each word, so the comprehension itself is a source.
      - patterns:
          - pattern-either:
              - pattern: '[$E for $V in $IT]'
              - pattern: '[$E for $V in $IT if $C]'
          - metavariable-regex:
              metavariable: $IT
              regex: (?s)^(.*\.split\(\s*(" ")?\)|re\.(findall|finditer|split)\(.*)$
    # A call's result is no longer the text, unless the call reshapes, tests or matches it.
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(str|set|frozenset|list|tuple|sorted|reversed|all|any|bool|next|filter|map|enumerate|zip)$)[A-Za-z_]\w*$
              - patterns:
                  - pattern: $O.$M(...)
                  - pattern-not: re.$RE(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?!(lower|upper|casefold|strip|lstrip|rstrip|replace|split|rsplit|splitlines|join|translate|removeprefix|removesuffix|format|title|capitalize|normalize|search|match|fullmatch|findall|finditer|sub|subn|startswith|endswith)$)
    pattern-sinks:
      # Membership in a set of words: a constant, or a literal of strings. A constant named
      # for a machine format (codes, countries, currencies, extensions, domains) is not one.
      - patterns:
          - pattern-either:
              - pattern: $T in $WORDS
              - pattern: $T not in $WORDS
              - pattern: $T & $WORDS
              - pattern: $WORDS & $T
              - pattern: $T - $WORDS
              - pattern: $T.issubset($WORDS)
              - pattern: $T.intersection($WORDS)
              - pattern: $T.isdisjoint($WORDS)
              - pattern: set($T) <= $WORDS
              - pattern: set($T) < $WORDS
          - metavariable-regex:
              metavariable: $WORDS
              regex: ^(?!.*(CODE|COUNTR|CURRENC|EXTENSION|MIME|TLD|DOMAIN|LOCALE|TIMEZONE|UNIT))_?[A-Z][A-Z0-9_]*$
          - focus-metavariable: $T
      # Membership in a literal of strings, unless ep-word-membership reports it.
      - patterns:
          - pattern-either:
              - pattern: $T in $LIT
              - pattern: $T not in $LIT
          - metavariable-pattern:
              metavariable: $LIT
              patterns:
                - pattern-either:
                    - pattern: ("...", ...)
                    - pattern: '{"...", ...}'
                    - pattern: '["...", ...]'
                - pattern-not-regex: *words
          - focus-metavariable: $T
      # A word or phrase looked for in the text, or the text compared with one.
      - patterns:
          - pattern-either:
              - pattern: '"$W" in $T'
              - pattern: '"$W" not in $T'
              - pattern: $T == "$W"
              - pattern: $T != "$W"
              - pattern: $T.startswith("$W", ...)
              - pattern: $T.endswith("$W", ...)
          - metavariable-regex:
              metavariable: $W
              regex: ^[A-Za-z][A-Za-z' ]+$
          - focus-metavariable: $T
      # A regex of words run over the text: \bword\b, or an alternation of words. A format
      # regex has neither; an alternation after \. is a list of file extensions.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: re.$FN($PAT, $T, ...)
                      - pattern: re.$FN($PAT, $REPL, $T, ...)
                  # ep-word-search reports an alternation of words on this line.
                  - metavariable-pattern:
                      metavariable: $PAT
                      language: generic
                      patterns:
                        - pattern-regex: (?s).+
                        - pattern-not-regex: *word-alternation
              # A compiled regex used on another line: ep-word-search reports where it is compiled.
              - patterns:
                  - pattern-inside: |
                      $R = re.compile($PAT, ...)
                      ...
                  - pattern-either:
                      - pattern: $R.$FN($T, ...)
                      - pattern: $R.$FN($REPL, $T, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(search|match|fullmatch|findall|finditer|sub|subn|split)$
          - metavariable-regex:
              metavariable: $PAT
              regex: (?s).*(\\b\(?(\?:)?[A-Za-z]{2,}(\\b|\|)|((?<!\\\.)\((\?:)?|["'])(((?!\\\.\()[^|"'])*\|)*[A-Za-z]([A-Za-z' -]|\\s[+*?]?|\?){2,}\|)
          - focus-metavariable: $T

  - id: ep-regex-over-sql
    languages: [python]
    severity: ERROR
    message: >-
      ep-regex-over-sql: a regex reads SQL text. SQL nests, quotes and aliases in ways a
      regex cannot follow, and a model's SQL changes shape when the model or prompt
      changes. Sound shapes: the generator returns the structure you need next to the
      SQL, or a real SQL parser reads it. A fixed statement the code itself writes is
      fine: keep it with `# nosemgrep: ep-regex-over-sql -- <reason>`, which the reviewer
      checks. If you cannot decide, ask the operator.
    metadata:
      example: |
        ALIAS_RE = re.compile(r"\bfrom\s+(\w+)\s+(?:as\s+)?(\w+)", re.I)
    patterns:
      - pattern-either:
          - patterns:
              - pattern: re.$FN($PAT, ...)
              - metavariable-regex:
                  metavariable: $PAT
                  regex: *sql
          # Any regex run over a value named for SQL.
          - patterns:
              - pattern-either:
                  - pattern: re.$FN($PAT, $ARG, ...)
                  - pattern: re.$FN($PAT, $REPL, $ARG, ...)
              - metavariable-regex:
                  metavariable: $ARG
                  regex: (?i)^(?!.*(path|file|name|dir)).*sql
          - patterns:
              - pattern-either:
                  - pattern: $R.$FN($ARG, ...)
                  - pattern: $R.$FN($REPL, $ARG, ...)
              - metavariable-regex:
                  metavariable: $R
                  regex: (?i).*(_re|_regex|_pattern)$
              - metavariable-regex:
                  metavariable: $ARG
                  regex: (?i)^(?!.*(path|file|name|dir)).*sql
      - metavariable-regex:
          metavariable: $FN
          regex: ^(compile|search|match|fullmatch|findall|finditer|sub|subn|split)$

  - id: ep-regex-over-markup
    languages: [python]
    severity: ERROR
    message: >-
      ep-regex-over-markup: a regex reads or converts HTML or XML. Markup nests, quotes and
      escapes in ways a regex cannot follow, and senders change their markup without
      notice. Sound shapes: a real parser, such as BeautifulSoup with lxml for HTML, or
      xml.etree or lxml for XML. A check that is not reading markup (escaping a delimiter
      the code itself defines) is fine: keep it with
      `# nosemgrep: ep-regex-over-markup -- <reason>`, which the reviewer checks. If you
      cannot decide, ask the operator.
    metadata:
      example: |
        LINK_RE = re.compile(r"<a\b[^>]*href=\"([^\"]*)\"", re.I)
    patterns:
      - pattern: re.$FN($PAT, ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(compile|search|match|fullmatch|findall|finditer|sub|subn|split)$
      - metavariable-regex:
          metavariable: $PAT
          regex: *markup


  # The ep-word rules find words in code whatever the names around them. They also fire on a
  # program's own closed sets (a grammar's operators, a provider's enum), which keep their line
  # with a reason.
  - id: ep-word-set
    languages: [python]
    severity: ERROR
    message: >-
      ep-word-set: a name holds three or more words. A word list in code decides what a
      text means by its spelling, so it misses phrasings, negations and other languages;
      or it fixes in code a vocabulary that the customer's data or settings define, which
      then changes only with a deploy. Sound shapes: read the values from the customer's
      data or settings, let a model read the text through a structured-output schema, or
      let the interface ask. A closed set that a schema, protocol or provider fixes is
      fine: keep it with `# nosemgrep: ep-word-set -- <reason>`, which the reviewer
      checks. If you cannot decide, ask the operator.
    metadata:
      example: |
        GREETINGS = frozenset({"hi", "hello", "good morning"})
    patterns:
      - pattern-either:
          - pattern: $NAME = $WORDS
          - pattern: '$NAME: $TYPE = $WORDS'
      # Python's own names (__slots__, __all__) hold the program's attribute and export names.
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(?!__\w+__$)
      - metavariable-regex:
          metavariable: $WORDS
          regex: *words

  - id: ep-word-search
    languages: [python]
    severity: ERROR
    message: >-
      ep-word-search: code looks for any of three or more words in a value: a regex that
      alternates words, or a loop over a list of words. Whatever the value is named, the
      search decides what it means by its spelling, and it misses phrasings, negations and
      other languages. Sound shapes: let a model read the text through a structured-output
      schema, read the values from the customer's data or settings, or let the interface
      ask. A closed set that a schema, protocol or provider fixes is fine: keep it with
      `# nosemgrep: ep-word-search -- <reason>`, which the reviewer checks. If you cannot
      decide, ask the operator.
    metadata:
      example: |
        THANKS = re.compile(r"\b(?:thanks|thank you|cheers)\b", re.I)
        if any(word in value for word in ("urgent", "asap", "today")): ...
    pattern-either:
      # A regex that alternates words, unless ep-regex-over-sql or ep-regex-over-markup reports it.
      - patterns:
          - pattern: re.$FN($PAT, ...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(compile|search|match|fullmatch|findall|finditer|sub|subn|split)$
          - metavariable-regex:
              metavariable: $PAT
              regex: *word-alternation
          - metavariable-pattern:
              metavariable: $PAT
              language: generic
              patterns:
                - pattern-regex: (?s).+
                - pattern-not-regex: *sql
                - pattern-not-regex: *markup
      # A comprehension or generator that tests each of three or more words against a value.
      - patterns:
          - pattern-either:
              - pattern-inside: '[$E for $W in $WORDS]'
              - pattern-inside: '[$E for $W in $WORDS if $C]'
              - pattern-inside: '{$E for $W in $WORDS}'
              - pattern-inside: '{$E for $W in $WORDS if $C}'
              - pattern-inside: '($E for $W in $WORDS)'
              - pattern-inside: '($E for $W in $WORDS if $C)'
          - metavariable-regex:
              metavariable: $WORDS
              regex: *words
          - pattern-either:
              - pattern: $W in $X
              - pattern: $W not in $X
              - pattern: $X == $W
              - pattern: $W == $X
              - pattern: re.$RE($W, ...)
              - patterns:
                  - pattern: $X.$M($W, ...)
                  # The str methods that look for a substring.
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(startswith|endswith|find|rfind|index|rindex|count)$

  - id: ep-word-membership
    languages: [python]
    severity: ERROR
    message: >-
      ep-word-membership: code tests whether a value is one of three or more words, or one
      of a constant's values folded the way the value is. Whatever the value is named, the
      test decides what it means by its spelling, and it misses phrasings, negations and
      other languages; or it fixes in code a vocabulary that the customer's data or
      settings define. Sound shapes: let a model read the text through a structured-output
      schema, read the values from the customer's data or settings, or let the interface
      ask. A closed set that a schema, protocol or provider fixes is fine: keep it with
      `# nosemgrep: ep-word-membership -- <reason>`, which the reviewer checks. If you
      cannot decide, ask the operator.
    metadata:
      example: |
        if answer.strip().lower() in ("yes", "yeah", "sure"): ...
        known = {normalise(word) for word in WORDS}
        if normalise(value) in known: ...
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $X in $WORDS
              - pattern: $X not in $WORDS
          - metavariable-regex:
              metavariable: $WORDS
              regex: *words
      # A value folded (case, accents, spaces) and looked up among a constant's values folded the
      # same way: the fold says the two are compared as written words, and the constant's words
      # often live in another file. A constant is named in capitals (PEP 8); a set folded from
      # data is a lookup, not a vocabulary.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = {$F($K) for $K in $C}
                          ...
                      - pattern-inside: |
                          $S = frozenset($F($K) for $K in $C)
                          ...
                  - pattern-either:
                      - pattern: $F($X) in $S
                      - pattern: $F($X) not in $S
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $S = {$K.$M() for $K in $C}
                          ...
                      - pattern-inside: |
                          $S = frozenset($K.$M() for $K in $C)
                          ...
                  - pattern-either:
                      - pattern: $X.$M() in $S
                      - pattern: $X.$M() not in $S
          - metavariable-regex:
              metavariable: $C
              regex: ^_?[A-Z][A-Z0-9_]*$
