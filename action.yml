name: Engineering practices quality check
description: >-
  Fails a pull request that adds dead code (knip, deadcode) and posts a Quality
  report that informs review. Configured by the caller's .github/quality.yml.
runs:
  using: composite
  steps:
    # knip loads the pull request's own config files. Under pull_request_target that code would
    # run with a write token and the repository's secrets, so the action refuses that event.
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::Run this action on pull_request, not pull_request_target: it executes the pull request's code."
        exit 1
    - name: Dead-code gate
      if: github.event_name != 'pull_request_target'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/checks.sh" gate'
      env:
        EP_BASE: ${{ github.event.pull_request.base.sha }}
    - name: Review measures (never fail)
      if: ${{ !cancelled() && github.event_name != 'pull_request_target' }}
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/checks.sh" measures'
      env:
        EP_BASE: ${{ github.event.pull_request.base.sha }}
    - name: Quality report
      if: ${{ !cancelled() && github.event_name != 'pull_request_target' }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/scripts/report.py"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        EP_PR_NUMBER: ${{ github.event.pull_request.number }}
        EP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
