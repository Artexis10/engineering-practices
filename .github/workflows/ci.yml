name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests -v

  # The action on this repository itself: proves action.yml's wiring, which the fixtures do not run.
  quality:
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    needs: [fixtures]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
